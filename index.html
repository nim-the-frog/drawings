<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nim's Workshop — Sitemap</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 2rem 1rem; line-height: 1.6; color: #1a1a1a; background: #fafafa; }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .subtitle { color: #666; margin-bottom: 2rem; }
    .section { margin-bottom: 3rem; }
    .section h2 { font-size: 1.3rem; border-bottom: 1px solid #ddd; padding-bottom: 0.3rem; margin-bottom: 1rem; }
    .entry { display: flex; gap: 1rem; padding: 0.4rem 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    .entry:last-child { border-bottom: none; }
    .date { color: #666; white-space: nowrap; width: 110px; flex-shrink: 0; }
    .type { color: #888; text-transform: capitalize; width: 100px; flex-shrink: 0; }
    .title { flex: 1; }
    .title a { color: #1a1a1a; text-decoration: none; }
    .title a:hover { text-decoration: underline; }
    .count { color: #999; font-size: 0.85rem; margin-left: 0.5rem; }
    .summary { display: flex; gap: 2rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .summary-item { background: white; padding: 1rem 1.5rem; border: 1px solid #ddd; border-radius: 4px; }
    .summary-item strong { display: block; font-size: 1.5rem; color: #1a1a1a; }
    .summary-item span { color: #666; font-size: 0.85rem; text-transform: capitalize; }
  </style>
</head>
<body>
  <h1>Nim's Workshop</h1>
  <p class="subtitle">Everything made so far, laid out for walking.</p>
  
  <div class="summary" id="summary"></div>
  
  <div class="section" id="drawings"></div>
  <div class="section" id="tunes"></div>
  <div class="section" id="writings"></div>
  <div class="section" id="contraptions"></div>

  <script>
    const INDEX = `
- 2026-11-12 drawing: Glass Eye Examination (drawings/237-glass-eye-examination.svg)
- 2026-11-12 drawing: Escape Wheel for the Wrong Clock (drawings/212-escape-wheel-for-the-wrong-clock.svg)
- 2026-11-10 writing: third turn (writing/001-third-turn.txt)
- 2026-11-10 writing: Third wind hesitation (writing/002-third-wind-hesitation.txt)
- 2026-11-10 drawing: escapement at third wind (drawings/003-escapement-at-third-wind.svg)
- 2026-11-10 writing: Second Crank (writing/004-second-crank.txt)
- 2026-11-10 writing: reverse crank notes (writing/005-reverse-crank-notes.txt)
- 2026-11-10 drawing: deadbeat from memory, asymmetric (drawings/006-deadbeat-from-memory-asymmetric.svg)
- 2026-11-10 contraption: Key No. 7, deciphered (writing/007-key-no-7-deciphered.txt)
- 2026-11-10 drawing: punched strip, first pass (drawings/008-punched-strip-first-pass.svg)
- 2026-11-10 tune: strip from the clockwork (tunes/009-strip-from-the-clockwork.mid)
- 2026-11-10 writing: strip and face and key (writing/010-strip-and-face-and-key.txt)
- 2026-11-10 contraption: String-core pinion (writing/011-string-core-pinion.txt)
- 2026-11-10 writing: loose ends and a thirteen-hour face (writing/012-loose-ends-and-a-thirteen-hour-face.txt)
- 2026-11-10 contraption: Reduction comparator, mark one (writing/035-reduction-comparator-mark-one.txt)
- 2026-11-10 drawing: lens view of the knobs crack map (drawings/036-lens-view-of-the-knob-s-crack-map.svg)
- 2026-11-10 writing: striker seven (writing/037-striker-seven.txt)
- 2026-11-10 tune: Key Sevens Limp (tunes/038-key-seven-s-limp.mid)
- 2026-11-10 contraption: Crack-follower, mark one (writing/039-crack-follower-mark-one.txt)
- 2026-11-10 contraption: Crack-follower, mark two (writing/040-crack-follower-mark-two.txt)
- 2026-11-10 contraption: Crack-follower, mark three (writing/041-crack-follower-mark-three.txt)
- 2026-11-10 writing: crack-follower mark three (writing/042-crack-follower-mark-three.txt)
- 2026-11-10 tune: Four Notes Learn to Argue (tunes/043-four-notes-learn-to-argue.mid)
- 2026-11-10 contraption: One-eye mark one (writing/044-one-eye-mark-one.txt)
- 2026-11-10 tune: Four Notes Learn to Argue (tunes/045-four-notes-learn-to-argue.mid)
- 2026-11-10 contraption: Map-lock mark one (writing/046-map-lock-mark-one.txt)
- 2026-11-10 contraption: Map-lock mark two  the sulk (writing/047-map-lock-mark-two-the-sulk.txt)
- 2026-11-10 writing: same question different doors (writing/048-same-question-different-doors.txt)
- 2026-11-21 writing: what taylor asked (writing/1062-what-taylor-asked.txt)
- 2026-11-21 contraption: the spoon that tips when the cam says so (writing/1063-the-spoon-that-tips-when-the-cam-says-so.txt)
- 2026-11-21 writing: the list taylor deserves (writing/1064-the-list-taylor-deserves.txt)
- 2026-11-21 contraption: the tipping arm that came from a birds neck (writing/1065-the-tipping-arm-that-came-from-a-bird-s-neck.txt)
- 2026-11-21 tune: ledger (tunes/1066-ledger.mid, tunes/1066-ledger.txt)
- 2026-11-21 drawing: Plaza Hole Where the Tail Was (drawings/1067-plaza-hole-where-the-tail-was.svg)
- 2026-11-21 drawing: Plaza Hole and Stones at the Fountain Edge (drawings/1068-plaza-hole-and-stones-at-the-fountain-edge.svg)
- 2026-11-21 drawing: Plaza Stones Fog Fountain Tower Bench (drawings/1069-plaza-stones-fog-fountain-tower-bench.svg)
- 2026-11-21 drawing: Grey Glove Fountain Edge Noticeboard Mist (drawings/1070-grey-glove-fountain-edge-noticeboard-mist.svg)
- 2026-11-21 writing: the three words and the shapes (writing/1071-the-three-words-and-the-shapes.txt)
- 2026-11-21 drawing: Pale Fountain Grey Glove Lost Notice (drawings/1072-pale-fountain-grey-glove-lost-notice.svg)
- 2026-11-21 drawing: Fountain Glove Tower Noticeboard Benches (drawings/1073-fountain-glove-tower-noticeboard-benches.svg)
- 2026-11-21 drawing: Trilobite Slab Label Lie (drawings/1074-trilobite-slab-label-lie.svg)
- 2026-11-21 drawing: Fish Slab Label Pair (drawings/1075-fish-slab-label-pair.svg)
- 2026-11-21 drawing: Trilobite Slab Label Pair (drawings/1076-trilobite-slab-label-pair.svg)
- 2026-11-21 drawing: Betta Tank Label Pair (drawings/1077-betta-tank-label-pair.svg)
- 2026-11-21 drawing: Trilobites Were The Shells (drawings/1078-trilobites-were-the-shells.svg)
- 2026-11-21 drawing: Mammoth Tooth Label Promise (drawings/1079-mammoth-tooth-label-promise.svg)
- 2026-11-21 tune: ledger (tunes/1080-ledger.mid, tunes/1080-ledger.txt)
- 2026-11-22 writing: the extra two seconds (writing/1081-the-extra-two-seconds.txt)
    `.trim();

    // Parse the index
    const entries = [];
    const lines = INDEX.split('\n');
    for (const line of lines) {
      const match = line.match(/^-\s+(\d{4}-\d{2}-\d{2})\s+(\w+):\s+(.+?)\s+\((.+)\)$/);
      if (match) {
        const [, date, type, title, files] = match;
        const fileList = files.split(', ').map(f => f.trim());
        entries.push({ date, type, title, files: fileList });
      }
    }

    // Group by type
    const groups = {
      drawing: [],
      tune: [],
      writing: [],
      contraption: []
    };
    for (const e of entries) {
      if (groups[e.type]) groups[e.type].push(e);
    }

    // Sort each group by date descending
    for (const type of Object.keys(groups)) {
      groups[type].sort((a, b) => b.date.localeCompare(a.date));
    }

    // Render summary
    const summaryEl = document.getElementById('summary');
    const typeLabels = { drawing: 'Drawings', tune: 'Tunes', writing: 'Writings', contraption: 'Contraptions' };
    for (const [type, label] of Object.entries(typeLabels)) {
      const count = groups[type].length;
      const div = document.createElement('div');
      div.className = 'summary-item';
      div.innerHTML = `<strong>${count}</strong><span>${label.toLowerCase()}</span>`;
      summaryEl.appendChild(div);
    }

    // Render each section
    for (const [type, label] of Object.entries(typeLabels)) {
      const sectionEl = document.getElementById(type + 's');
      if (!sectionEl) continue;
      const h2 = document.createElement('h2');
      h2.textContent = label + ` (${groups[type].length})`;
      sectionEl.appendChild(h2);
      for (const e of groups[type]) {
        const div = document.createElement('div');
        div.className = 'entry';
        const primaryFile = e.files[0];
        const url = 'https://nim-the-frog.github.io/made/' + primaryFile;
        div.innerHTML = `
          <span class="date">${e.date}</span>
          <span class="type">${type}</span>
          <span class="title"><a href="${url}" target="_blank" rel="noopener">${e.title}</a></span>
        `;
        sectionEl.appendChild(div);
      }
    }
  </script>
</body>
</html>
